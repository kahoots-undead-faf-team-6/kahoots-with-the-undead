# Lab 5: pg-router (deploy/postgres/pg-router). Tests on every PR that touches deploy/postgres; on a merge to
# main, pushes mituvladlen/pg-router:<VERSION> and :latest (amd64 + arm64) to DockerHub.
# Token: the repository secret DOCKERHUB_TOKEN, else the organization secret MITUVLADLEN
# (Vladlen's DockerHub access token, Read & Write).
name: pg-router

on:
  pull_request:
    branches: [main, development]
    paths: ["deploy/postgres/**", ".github/workflows/pg-router.yml"]
  push:
    branches: [main]
    paths: ["deploy/postgres/**", ".github/workflows/pg-router.yml"]
  workflow_dispatch:

env:
  DOCKERHUB_USER: mituvladlen

defaults:
  run:
    working-directory: deploy/postgres/pg-router

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (fails under 80% coverage of the decisions)
        run: pytest -q --cov=pgrouter --cov-report=term-missing --cov-fail-under=80
      - name: Shell scripts parse
        working-directory: deploy/postgres
        run: sh -n standby-entrypoint.sh && sh -n init-replication.sh

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the DockerHub token
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.MITUVLADLEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the secret DOCKERHUB_TOKEN (or the organization secret MITUVLADLEN) with a DockerHub access token."
            exit 1
          fi
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.MITUVLADLEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres/pg-router
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USER }}/pg-router:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USER }}/pg-router:latest
      - name: Summary
        run: echo "Pushed ${{ env.DOCKERHUB_USER }}/pg-router:${{ steps.version.outputs.version }} and :latest" >> "$GITHUB_STEP_SUMMARY"
