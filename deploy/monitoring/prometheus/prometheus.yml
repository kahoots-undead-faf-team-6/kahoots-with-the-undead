# Lab 4 monitoring (docs/lab4-contract.md section 14).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Service Discovery itself has no /metrics (its load is in GET /status), so it is not scraped.
  # Every UP instance registered in Service Discovery (services and the gateway), found through
  # SD's GET /prometheus/targets (http_sd), so new replicas are scraped without editing this file.
  # Each target comes with the labels service and instance_id; the services' own series carry the
  # same two labels, so honor_labels keeps them as they are.
  - job_name: services
    honor_labels: true
    http_sd_configs:
      - url: http://service-discovery:8500/prometheus/targets
        refresh_interval: 10s
    relabel_configs:
      # the broker is scraped by its own job below (once, not twice)
      - source_labels: [service]
        regex: message-broker
        action: drop
      # show the instance id instead of host:port in Prometheus and Grafana
      - source_labels: [instance_id]
        target_label: instance

  # The broker's admin port (calls, events, queues, DLQ, circuits, threads, least-load scores).
  # Its own series use `service` for the TARGET service (e.g. broker_calls_total{target,status}).
  - job_name: message-broker
    honor_labels: true
    static_configs:
      - targets: ["message-broker:8600"]
        labels:
          instance_id: message-broker
