# Ships the shared "logs" volume (/var/log/kahoots/<instanceId>.log, one JSON object per line) to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kahoots
    static_configs:
      - targets: [localhost]
        labels:
          job: kahoots
          __path__: /var/log/kahoots/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            service: service
            instanceId: instanceId
            requestId: requestId
      - labels:
          level:
          service:
          instanceId:
      - timestamp:
          source: time
          format: RFC3339Nano
