# Only DockerHub images, never build:. Copy .env.example to .env and fill it in.
# Services owned by other teammates are added by their owners via PR.
services:
  world-mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${WORLD_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${WORLD_MONGO_PASSWORD}
    volumes:
      - world-mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  zombie-mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ZOMBIE_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ZOMBIE_MONGO_PASSWORD}
    volumes:
      - zombie-mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"

  world-service:
    image: ${DOCKERHUB_USER}/world-service:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      STORAGE: mongo
      MONGO_URI: mongodb://${WORLD_MONGO_USER}:${WORLD_MONGO_PASSWORD}@world-mongo:27017/world?authSource=admin
      MONGO_DB: world
    depends_on:
      - world-mongo
    ports:
      - "3001:3001"

  zombie-service:
    image: ${DOCKERHUB_USER}/zombie-service:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3002"
      STORAGE: mongo
      MONGO_URI: mongodb://${ZOMBIE_MONGO_USER}:${ZOMBIE_MONGO_PASSWORD}@zombie-mongo:27017/zombie?authSource=admin
      MONGO_DB: zombie
    depends_on:
      - zombie-mongo
    ports:
      - "3002:3002"

volumes:
  world-mongo-data:
  zombie-mongo-data:
